[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-code-gatekeeper"
version = "0.1.0"
description = "Brama jakości dla kodu generowanego przez agentów LLM"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Binaria, które bramki uruchamiają jako podprocesy (`core.runner.Sandbox`),
# nie jako biblioteki Pythona. Brak któregoś z nich nie wywraca instalacji —
# odpowiednia bramka zgłasza `error` z jasnym komunikatem (TOOLS.md §3, §5).
gates = [
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
    "semgrep>=1.70",
    "pip-audit>=2.7",
]

[project.scripts]
gatekeeper = "gatekeeper.cli:main"

[tool.setuptools.packages.find]
include = ["gatekeeper*"]

[tool.setuptools.package-data]
gatekeeper = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer buduje interfejs CLI z wartości domyślnych — B008 nie ma tu zastosowania
"gatekeeper/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
