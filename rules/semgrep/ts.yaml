# Reguły „nigdy" dla TS/JS — wydzielone z dawnego wspólnego `never.yaml` przy
# podziale na pack'i językowe: ten plik żyje w `llm-code-gatekeeper-ts`
# (ts-pack), rejestrowany jako `SemgrepRulePackProvider` (`pack_id="ts"`).
#
# Każda reguła MUSI mieć test pozytywny i negatywny w rules/semgrep/tests/.
# Uruchomienie testów: semgrep --test --config rules/semgrep rules/semgrep/tests

rules:
  - id: no-dangerous-html-unsanitized
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      dangerouslySetInnerHTML wstawia HTML, który nie przeszedł przez
      sanityzator w tym samym wyrażeniu.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation ('Cross-site Scripting')"
      failure_scenario: >-
        HTML trafia do DOM-u bez sanityzacji (np. DOMPurify.sanitize), więc
        znacznik w rodzaju `<img src=x onerror=...>` albo `<script>` wklejony
        do treści — importem pliku, wklejeniem z zewnątrz, albo przez parser
        markdown, który domyślnie przepuszcza surowy HTML wejściowy — wykona
        się w przeglądarce z pełnym dostępem do sesji ofiary: odczyta
        localStorage, podszyje się pod użytkownika, wyśle dane na zewnątrz.
    patterns:
      - pattern-either:
          - pattern: '<$EL dangerouslySetInnerHTML={{ __html: $HTML }} ... />'
          - pattern: 'React.createElement($EL, { dangerouslySetInnerHTML: { __html: $HTML }, ... })'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{ __html: $SANI.sanitize(...) }} ... />'
      - pattern-not: '<$EL dangerouslySetInnerHTML={{ __html: sanitizeHtml(...) }} ... />'

  - id: no-eval-on-input-js
    languages: [typescript, javascript]
    severity: ERROR
    message: Dynamiczne wykonanie kodu na danych z zewnątrz.
    metadata:
      cwe: "CWE-95: Eval Injection"
      failure_scenario: >-
        Wejście sterujące trafia do interpretera JS-a, więc wartość taka jak
        `fetch(...).then(r=>r.json())` podmieniona na złośliwy string wykona
        dowolny kod z uprawnieniami procesu (Node) albo sesji (przeglądarka).
        Osobna reguła od Pythona: `exec` w Node-owym `child_process` to zupełnie
        inna funkcja (uruchamia proces, nie interpretuje kodu) i nie ma prawa
        trafić w tę samą regułę, co realny `eval`/`new Function`.
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
      - pattern-not: eval("...")

  - id: no-shell-true-js
    languages: [typescript, javascript]
    severity: ERROR
    message: Uruchomienie polecenia powłoki z interpolacją danych.
    metadata:
      cwe: "CWE-78: OS Command Injection"
      failure_scenario: >-
        `child_process.exec`/`execSync` przepuszczają cały string przez powłokę,
        więc wartość `plik.txt; rm -rf /` w interpolowanym argumencie uruchomi
        drugie polecenie. `execFile`/`spawn` z argumentami jako tablicą (bez
        powłoki) nie mają tej podatności — stąd `pattern-not` niżej.
    patterns:
      - pattern-either:
          - pattern: $CP.exec(`...${$X}...`, ...)
          - pattern: $CP.exec("..." + $X, ...)
          - pattern: $CP.execSync(`...${$X}...`, ...)
          - pattern: $CP.execSync("..." + $X, ...)

  - id: no-tls-verify-disabled-js
    languages: [typescript, javascript]
    severity: ERROR
    message: Wyłączona weryfikacja certyfikatu TLS.
    metadata:
      cwe: "CWE-295: Improper Certificate Validation"
      failure_scenario: >-
        Połączenie przyjmie dowolny certyfikat, więc każdy, kto potrafi wpiąć
        się w ruch, odczyta i podmieni przesyłane dane — awaria jest niewidoczna
        aż do momentu ataku, tak samo jak przy `verify=False` w Pythonie.
    patterns:
      - pattern-either:
          - pattern: "{rejectUnauthorized: false, ...}"
          - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
