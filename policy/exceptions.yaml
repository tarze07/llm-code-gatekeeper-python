# Wyjątki od reguł bramy.
#
# Każdy wpis wymaga właściciela, powodu i daty wygaśnięcia (max 30 dni).
# Wygasły wyjątek jest błędem walidacji polityki, nie cichym przepuszczeniem —
# bez tego po pół roku polityka jest zbiorem wyjątków (PLAN.md §4).
