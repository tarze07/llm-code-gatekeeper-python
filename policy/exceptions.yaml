#     reason: "biblioteka klienta naszego wewnętrznego API, wydana 2 tygodnie temu"
#     expires: 2026-09-01
#     fingerprints: []   # opcjonalnie: zawęź wyjątek do konkretnych znalezisk

exceptions: []
